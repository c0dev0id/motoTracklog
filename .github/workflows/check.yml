name: Check

# Pre-merge gate: lint, unit tests and an unminified debug build on every branch push.
# There is no pull_request trigger: a check run attaches to the head commit, so the push
# run's result already shows on a PR. The signed, minified release build and the `dev`
# pre-release stay in build.yml, which runs only on push to main.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Robolectric fetches its ~100 MB android-all jar at test runtime with its own
      # resolver, into ~/.m2 — outside the Gradle cache setup-gradle restores.
      - name: Cache Robolectric SDK jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: robolectric-

      - name: Test the release scripts
        run: python3 -m unittest discover -s .github/scripts

      # One Gradle invocation: shared compilation and daemon start-up, and --continue
      # reports lint, test and compile failures together.
      - name: Lint, test and build debug
        run: >-
          ./gradlew --continue
          lintGithubDebug testGithubDebugUnitTest
          assembleGithubDebug

      # The debug build installs beside the release build (.debug applicationId).
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/*/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore
