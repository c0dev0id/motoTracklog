name: Release

# Cuts the next 1.0.x from main: moves the [Unreleased] changelog entries under the new
# version, tags it and publishes the github APK as a GitHub release.
on:
  workflow_dispatch:

concurrency:
  group: release

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Choose the version
        run: |
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$last" ]; then
            version=1.0.0
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            version="$major.$minor.$((patch + 1))"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Write the release notes and commit the changelog
        run: |
          python3 .github/scripts/changelog.py release "$VERSION" "$(date -u +%F)" > "$RUNNER_TEMP/notes.md"
          git config user.name c0dev0id
          git config user.email sh+git@codevoid.de
          git commit -qam "Release $VERSION"
          git tag "v$VERSION"

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/release.keystore"

      - name: Build the GitHub APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew assembleGithubRelease \
            -PappVersionName="$VERSION" \
            -PappVersionCode="$(git rev-list --count HEAD)"
          mv app/build/outputs/apk/github/release/app-github-release.apk "motoTracklog-$VERSION.apk"

      # Nothing is pushed until the build exists, and the push fails as a whole if main
      # moved meanwhile.
      - name: Push the release commit and tag
        run: git push --atomic origin HEAD:main "refs/tags/v$VERSION"

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: ${{ env.VERSION }}
          body_path: ${{ runner.temp }}/notes.md
          files: motoTracklog-${{ env.VERSION }}.apk
