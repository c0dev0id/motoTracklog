name: Build

on:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Check already lints githubDebug; this covers the variant that ships.
      - name: Lint the release variant
        run: ./gradlew lintGithubRelease

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Robolectric SDK jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: robolectric-

      - name: Run unit tests
        run: ./gradlew testGithubDebugUnitTest

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Full history: the versionCode is the commit count, shared with release.yml.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/release.keystore"

      - name: Build signed GitHub release APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          ./gradlew assembleGithubRelease \
            -PappVersionName="dev-${SHORT_SHA}" \
            -PappVersionCode="$(git rev-list --count HEAD)"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/github/release/app-github-release.apk

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download signed APK
        uses: actions/download-artifact@v4.1.3
        with:
          name: app-release

      - name: Rename APK
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          mv app-github-release.apk "motoTracklog-dev-${SHORT_SHA}.apk"
          echo "apk_name=motoTracklog-dev-${SHORT_SHA}.apk" >> "$GITHUB_ENV"

      - name: Delete existing dev release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete dev --yes 2>/dev/null || true

      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Development Build
          body: |
            Automated development build from commit ${{ github.sha }} on ${{ github.ref_name }}.

            This is a pre-release snapshot — not intended for production use.
          draft: false
          prerelease: true
          make_latest: false
          files: ${{ env.apk_name }}
